name: Build & Publish wheels
on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build sdist
        run: pipx run build --sdist

      - name: Install sdist
        run: pip install dist/*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: "sdist"
          path: dist/*.tar.gz

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: [build_sdist]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Build wheels
        uses: joerick/cibuildwheel@v3.3
        env:
          CIBW_TEST_SKIP: "*"
          CIBW_SKIP: "pp*"

      - uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.os }}"
          path: ./wheelhouse/*.whl
          retention-days: 2

  build_manylinux_wheels_ubuntu:
    name: Build manylinux wheels on ubuntu-latest
    runs-on: ubuntu-latest
    needs: [build_sdist]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Build wheels
        uses: joerick/cibuildwheel@v3.3
        env:
          CIBW_TEST_SKIP: "*"
          CIBW_SKIP: "pp* *-musllinux*"

      - uses: actions/upload-artifact@v4
        with:
          name: "manylinux"
          path: ./wheelhouse/*.whl
          retention-days: 2

  build_musllinux_wheels_ubuntu:
    name: Build musllinux wheels on ubuntu-latest
    runs-on: ubuntu-latest
    needs: [build_sdist]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Build wheels
        uses: joerick/cibuildwheel@v3.3
        env:
          CIBW_TEST_SKIP: "*"
          CIBW_SKIP: "pp* *-manylinux*"
          CIBW_BEFORE_ALL: "apk add libgcc libstdc++"
          CIBW_REPAIR_WHEEL_COMMAND: "auditwheel repair -w {dest_dir} {wheel} --exclude libdl.so.2 --exclude librt.so.1 --exclude libm.so.6 --exclude libpthread.so.0 --exclude libc.so.6"

      - uses: actions/upload-artifact@v4
        with:
          name: "musllinux"
          path: ./wheelhouse/*.whl
          retention-days: 2

  upload_github_release:
    name: Upload Artifacts to GitHub Release
    needs: [build_sdist, build_wheels, build_manylinux_wheels_ubuntu, build_musllinux_wheels_ubuntu]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload Wheels & Source to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*