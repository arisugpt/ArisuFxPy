name: Build ArisuFxPy Wheels

on:
  push:
    branches: [ main ]
    tags:
      - 'v*' # Jab aap koi tag push karenge (e.g., v1.0.0), tab build trigger hoga
  workflow_dispatch: # Manual run karne ke liye button

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build wheel setuptools cibuildwheel

      - name: Build wheels
        run: |
          # Ye command automatically C++ code ko compile karke .whl files banayegi
          cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp38-* cp39-* cp310-* cp311-* cp312-*"
          # Windows ke liye C++20 flag
          CIBW_ENVIRONMENT_WINDOWS: "CXXFLAGS=/std:c++20"
          # Linux/Mac ke liye C++20 flag
          CIBW_ENVIRONMENT: "CXXFLAGS=-std=c++20"

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arisufxpy-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl